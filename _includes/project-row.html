<article class="work-row">
  <span class="work-number" aria-hidden="true">{{ include.project.number }}</span>
  <div class="work-title"><h3><a href="{{ include.project.url | relative_url }}">{{ include.project.name }}</a></h3><p class="meta">{{ include.project.category }}</p></div>
  <div class="work-summary"><p>{{ include.project.summary }}</p><p class="result">{{ include.project.result }}</p><a class="text-link" href="{{ include.project.url | relative_url }}">Explore {{ include.project.name }} <span aria-hidden="true">→</span></a></div>
</article>
