---
layout: default
---
<header class="page-heading">
  {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.intro %}<p class="lede">{{ page.intro }}</p>{% endif %}
</header>
<div class="page-body{% if page.prose %} prose{% endif %}">{{ content }}</div>
